
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="192" height="192">
  <defs>
    <!-- Gradient principal du cercle -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b5fff"/>
      <stop offset="55%" stop-color="#0a3fb8"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>

    <!-- Gradient de l'onde de pouls -->
    <linearGradient id="pulseLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0c000"/>
    </linearGradient>

    <!-- Halo doré pour les points -->
    <radialGradient id="goldHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0a800" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e0a800" stop-opacity="0"/>
    </radialGradient>

    <!-- Filtre de glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Cercle fond -->
  <circle cx="100" cy="100" r="98" fill="url(#iconBg)"/>

  <!-- Cercles lumineux discrets en fond -->
  <circle cx="150" cy="55" r="60" fill="#ffffff" opacity="0.06"/>
  <circle cx="40" cy="160" r="50" fill="#ffffff" opacity="0.05"/>

  <!-- Réseau : petites lignes en arrière-plan -->
  <g stroke="#ffffff" stroke-width="0.8" opacity="0.25" stroke-linecap="round">
    <line x1="60" y1="80" x2="90" y2="70"/>
    <line x1="90" y1="70" x2="130" y2="75"/>
    <line x1="130" y1="75" x2="150" y2="105"/>
    <line x1="150" y1="105" x2="125" y2="140"/>
    <line x1="125" y1="140" x2="90" y2="150"/>
    <line x1="90" y1="150" x2="55" y2="135"/>
    <line x1="55" y1="135" x2="60" y2="80"/>
    <line x1="90" y1="70" x2="100" y2="105"/>
    <line x1="100" y1="105" x2="130" y2="75"/>
    <line x1="100" y1="105" x2="125" y2="140"/>
    <line x1="100" y1="105" x2="55" y2="135"/>
  </g>

  <!-- Points du réseau (blancs) -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="60" cy="80" r="2.2"/>
    <circle cx="90" cy="70" r="2.2"/>
    <circle cx="130" cy="75" r="2.2"/>
    <circle cx="150" cy="105" r="2.2"/>
    <circle cx="125" cy="140" r="2.2"/>
    <circle cx="90" cy="150" r="2.2"/>
    <circle cx="55" cy="135" r="2.2"/>
    <circle cx="100" cy="105" r="2.5"/>
  </g>

  <!-- Onde de pouls principale -->
  <g filter="url(#glow)">
    <path d="M 20 100
             L 45 100
             L 52 92
             L 58 108
             L 65 55
             L 75 145
             L 85 85
             L 92 100
             L 108 100
             L 115 92
             L 122 108
             L 132 65
             L 142 140
             L 152 95
             L 160 100
             L 180 100"
          fill="none"
          stroke="url(#pulseLine)"
          stroke-width="7"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- Points chauds (dorés) sur les pics -->
  <g>
    <circle cx="65" cy="55" r="8" fill="url(#goldHalo)"/>
    <circle cx="65" cy="55" r="3.5" fill="#f0c000"/>

    <circle cx="132" cy="65" r="7" fill="url(#goldHalo)"/>
    <circle cx="132" cy="65" r="3" fill="#f0c000"/>
  </g>
</svg>