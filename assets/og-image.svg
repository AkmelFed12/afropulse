
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="og_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062a7a"/>
      <stop offset="50%" stop-color="#0b5fff"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="og_iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b5fff"/>
      <stop offset="55%" stop-color="#0a3fb8"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="og_pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0c000"/>
    </linearGradient>
    <linearGradient id="og_textPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#e0a800"/>
    </linearGradient>
    <radialGradient id="og_halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0a800" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e0a800" stop-opacity="0"/>
    </radialGradient>
    <filter id="og_glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="1200" height="630" fill="url(#og_bg)"/>
  <circle cx="1050" cy="100" r="380" fill="#ffffff" opacity="0.05"/>
  <circle cx="100" cy="580" r="300" fill="#ffffff" opacity="0.04"/>

  <!-- Grille subtile -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.03">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="50" y1="0" x2="50" y2="630"/><line x1="100" y1="0" x2="100" y2="630"/><line x1="150" y1="0" x2="150" y2="630"/><line x1="200" y1="0" x2="200" y2="630"/><line x1="250" y1="0" x2="250" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/><line x1="350" y1="0" x2="350" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/><line x1="450" y1="0" x2="450" y2="630"/><line x1="500" y1="0" x2="500" y2="630"/><line x1="550" y1="0" x2="550" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="650" y1="0" x2="650" y2="630"/><line x1="700" y1="0" x2="700" y2="630"/><line x1="750" y1="0" x2="750" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/><line x1="850" y1="0" x2="850" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/><line x1="950" y1="0" x2="950" y2="630"/><line x1="1000" y1="0" x2="1000" y2="630"/><line x1="1050" y1="0" x2="1050" y2="630"/><line x1="1100" y1="0" x2="1100" y2="630"/><line x1="1150" y1="0" x2="1150" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="50" x2="1200" y2="50"/><line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="150" x2="1200" y2="150"/><line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="250" x2="1200" y2="250"/><line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="350" x2="1200" y2="350"/><line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="500" x2="1200" y2="500"/><line x1="0" y1="550" x2="1200" y2="550"/><line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Icon à droite -->
  <g transform="translate(760, 180)">
    <circle cx="120" cy="120" r="118" fill="url(#og_iconBg)"/>
    <circle cx="180" cy="60" r="70" fill="#ffffff" opacity="0.06"/>
    <circle cx="45" cy="195" r="60" fill="#ffffff" opacity="0.05"/>

    <g stroke="#ffffff" stroke-width="0.9" opacity="0.25">
      <line x1="70" y1="95" x2="105" y2="82"/>
      <line x1="105" y1="82" x2="155" y2="88"/>
      <line x1="155" y1="88" x2="180" y2="125"/>
      <line x1="180" y1="125" x2="150" y2="165"/>
      <line x1="150" y1="165" x2="105" y2="178"/>
      <line x1="105" y1="178" x2="65" y2="160"/>
      <line x1="65" y1="160" x2="70" y2="95"/>
      <line x1="118" y1="125" x2="105" y2="82"/>
      <line x1="118" y1="125" x2="180" y2="125"/>
      <line x1="118" y1="125" x2="105" y2="178"/>
    </g>
    <g fill="#ffffff" opacity="0.7">
      <circle cx="70" cy="95" r="2.5"/>
      <circle cx="105" cy="82" r="2.5"/>
      <circle cx="155" cy="88" r="2.5"/>
      <circle cx="180" cy="125" r="2.5"/>
      <circle cx="150" cy="165" r="2.5"/>
      <circle cx="105" cy="178" r="2.5"/>
      <circle cx="65" cy="160" r="2.5"/>
      <circle cx="118" cy="125" r="3"/>
    </g>

    <g filter="url(#og_glow)">
      <path d="M 22 120 L 52 120 L 60 110 L 68 130 L 78 65 L 90 175 L 102 102 L 112 120 L 132 120 L 142 110 L 150 130 L 162 78 L 174 168 L 186 114 L 196 120 L 218 120"
            fill="none" stroke="url(#og_pulse)" stroke-width="8"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <circle cx="78" cy="65" r="10" fill="url(#og_halo)"/>
    <circle cx="78" cy="65" r="4" fill="#f0c000"/>
    <circle cx="162" cy="78" r="9" fill="url(#og_halo)"/>
    <circle cx="162" cy="78" r="3.5" fill="#f0c000"/>
  </g>

  <!-- Text à gauche -->
  <g font-family="Inter, system-ui, sans-serif" font-weight="800" letter-spacing="-2">
    <text x="80" y="290" font-size="120" fill="#ffffff">AFRO</text>
    <text x="80" y="410" font-size="120" fill="url(#og_textPulse)">PULSE</text>
  </g>

  <text x="84" y="480"
        font-family="Inter, system-ui, sans-serif"
        font-weight="600"
        font-size="26"
        fill="#ffffff"
        opacity="0.85">Le réseau des talents et entreprises africaines</text>

  <text x="84" y="530"
        font-family="Inter, system-ui, sans-serif"
        font-weight="600"
        font-size="18"
        fill="#ffffff"
        opacity="0.6"
        letter-spacing="4">BY LMO SERVICES</text>

  <!-- URL -->
  <text x="84" y="590"
        font-family="Inter, system-ui, sans-serif"
        font-weight="700"
        font-size="18"
        fill="#ffffff"
        opacity="0.5">afro-pulse.netlify.app</text>

  <!-- Barre dorée -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#og_textPulse)"/>
</svg>