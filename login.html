<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connexion, AfroPulse</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M2 12h3l2-5 3 10 3-12 3 8 2-3h3' fill='none' stroke='%230b5fff' stroke-width='2.5' stroke-linecap='round'/></svg>">
<script>document.documentElement.classList.toggle('dark',localStorage.getItem('ap-theme')==='dark'||(!localStorage.getItem('ap-theme')&&matchMedia('(prefers-color-scheme:dark)').matches));</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tailwind.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="font-sans">

<main class="relative">
<div class="absolute inset-0 grid-bg pointer-events-none"></div>
<div class="relative max-w-md mx-auto px-4 py-16">
  <div class="text-center mb-8">
    <div class="w-12 h-12 mx-auto rounded-xl grid place-items-center mb-4" style="background:color-mix(in srgb,var(--ac) 10%,transparent);border:1px solid color-mix(in srgb,var(--ac) 20%,transparent)">
      <i class="fa-solid fa-arrow-right-to-bracket" style="color:var(--ac)"></i>
    </div>
    <h1 class="text-2xl font-bold mb-2">Connexion à votre compte</h1>
    <p class="text-sm" style="color:var(--mu)">Entrez vos identifiants pour continuer.</p>
  </div>

  <div id="confirmMsg" class="hidden mb-6 p-4 rounded-xl flex items-center gap-3" style="background:color-mix(in srgb,var(--ok) 10%,transparent);border:1px solid color-mix(in srgb,var(--ok) 25%,transparent)">
    <i class="fa-solid fa-circle-check text-lg" style="color:var(--ok)"></i>
    <div class="text-xs">
      <div class="font-bold" style="color:var(--ok)">Adresse email confirmée</div>
      <div style="color:var(--mu)">Vous pouvez vous connecter.</div>
    </div>
  </div>

  <form id="loginForm" class="card-static p-6">
    <div class="space-y-4">
      <div>
        <label for="email" class="lbl">Adresse email</label>
        <input id="email" class="input" type="email" placeholder="vous@exemple.com" autocomplete="email" required>
      </div>
      <div>
        <label for="password" class="lbl">Mot de passe</label>
        <input id="password" class="input" type="password" placeholder="Votre mot de passe" autocomplete="current-password" required>
      </div>
    </div>
    <div class="text-right mt-2">
      <a href="forgot-password.html" class="text-xs font-semibold" style="color:var(--ac)">Mot de passe oublié ?</a>
    </div>
    <p id="error" class="hidden text-xs mt-3" style="color:var(--er)"></p>
    <button type="submit" id="btn" class="btn bp w-full mt-4">Se connecter</button>
    <p class="text-xs text-center mt-4" style="color:var(--mu)">
      Pas encore de compte ? <a href="signup.html" class="font-semibold" style="color:var(--ac)">Créer un compte</a>
    </p>
  </form>
</div>
</main>

<script src="assets/env.js"></script>
<script src="assets/db.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/app.js"></script>
<script>
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const next=params.get('next')||'dashboard.html';

if(params.get('confirmed')==='1'){
  const msg=$('confirmMsg');
  if(msg)msg.classList.remove('hidden');
}

addEventListener('DOMContentLoaded',async()=>{
  await new Promise(r=>setTimeout(r,500));
  if(Auth.isLogged())location.href=next;
});

$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=$('btn'),err=$('error');
  const email=$('email').value.trim();
  const password=$('password').value;
  err.classList.add('hidden');
  btn.disabled=true;
  btn.innerHTML='<i class="fa-solid fa-circle-notch fa-spin text-xs"></i>Connexion…';
  try{
    await Auth.login(email,password);
    location.href=next;
  }catch(ex){
    err.textContent=ex.message==='Invalid login credentials'?'Email ou mot de passe incorrect.':ex.message;
    err.classList.remove('hidden');
    btn.disabled=false;
    btn.textContent='Se connecter';
  }
});
</script>
</body>
</html>
