<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Candidatures reçues — AfroPulse</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M2 12h3l2-5 3 10 3-12 3 8 2-3h3' fill='none' stroke='%230b5fff' stroke-width='2.5' stroke-linecap='round'/></svg>">
<script>document.documentElement.classList.toggle('dark',localStorage.getItem('ap-theme')==='dark'||(!localStorage.getItem('ap-theme')&&matchMedia('(prefers-color-scheme:dark)').matches));</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tailwind.css">
<link rel="stylesheet" href="assets/style.css">
<style>
.tabs-bar{display:inline-flex;gap:.25rem;padding:.25rem;border-radius:.75rem;background:var(--sf);border:1px solid var(--bd)}
.tabs-bar button{padding:.5rem 1rem;border-radius:.5rem;font-size:.75rem;font-weight:600;border:none;background:transparent;color:var(--mu);cursor:pointer;font-family:inherit;transition:.2s}
.tabs-bar button.on{background:var(--ac);color:#fff}
.item-card{background:var(--sf);border:1px solid var(--bd);border-radius:1rem;padding:1.25rem;transition:.2s}
.item-card:hover{border-color:var(--ac)}
.bdg{display:inline-flex;align-items:center;gap:.3rem;font-size:.65rem;font-weight:700;padding:.25rem .6rem;border-radius:999px;white-space:nowrap}
.bdg.w{background:color-mix(in srgb,var(--gd) 12%,transparent);color:var(--gd)}
.bdg.o{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok)}
.bdg.k{background:color-mix(in srgb,var(--er) 12%,transparent);color:var(--er)}
.act{padding:.5rem .9rem;font-size:.75rem;font-weight:600;border-radius:.5rem;border:1px solid var(--bd);background:var(--sf);color:var(--ink);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:.35rem;transition:.15s}
.act:hover{background:var(--bg)}
.act-ok{border-color:color-mix(in srgb,var(--ok) 40%,transparent);color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,transparent)}
.act-ko{border-color:color-mix(in srgb,var(--er) 40%,transparent);color:var(--er);background:color-mix(in srgb,var(--er) 8%,transparent)}
.act-gold{border-color:color-mix(in srgb,var(--gd) 40%,transparent);color:var(--gd);background:color-mix(in srgb,var(--gd) 8%,transparent)}
.empty{padding:4rem 1rem;text-align:center;color:var(--mu);font-size:.85rem}
.empty i{display:block;font-size:2.5rem;margin-bottom:1rem;opacity:.35}
.modal-bg{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:1rem;background:rgba(0,0,0,.6);backdrop-filter:blur(6px)}
.modal-bg.on{display:flex}
.rate-input{display:flex;gap:.4rem;font-size:1.75rem;color:var(--mu);cursor:pointer;justify-content:center}
.rate-input i{transition:.15s}
.rate-input i.active{color:var(--gd);transform:scale(1.1)}
</style>
</head>
<body class="font-sans">

<main class="relative">
<div class="absolute inset-0 grid-bg pointer-events-none"></div>
<div class="relative max-w-4xl mx-auto px-4 py-10">
  <div class="mb-8">
    <span class="chip mb-4"><i class="fa-solid fa-paper-plane text-[10px]"></i>Espace entreprise</span>
    <h1 class="text-3xl sm:text-4xl font-bold mb-2" style="color:var(--ink)">Candidatures reçues</h1>
    <p class="text-sm max-w-2xl" style="color:var(--mu)">Gérez les candidatures reçues sur vos missions publiées.</p>
  </div>

  <div class="mb-6 flex flex-wrap gap-3 items-center">
    <div class="tabs-bar" id="tabsBar">
      <button data-tab="all" class="on">Toutes</button>
      <button data-tab="envoyee">En attente</button>
      <button data-tab="acceptee">Acceptées</button>
      <button data-tab="refusee">Refusées</button>
    </div>
    <button onclick="Page.load()" class="act"><i class="fa-solid fa-rotate"></i>Rafraîchir</button>
  </div>

  <div class="mb-3 text-xs" style="color:var(--mu)"><span id="count">—</span> candidature(s)</div>
  <div id="list" class="space-y-3"></div>
</div>
</main>

<div id="reviewModal" class="modal-bg">
  <div class="w-full max-w-md p-6 rounded-2xl" style="background:var(--sf);border:1px solid var(--bd)">
    <div class="flex items-center justify-between mb-4">
      <div class="font-bold" style="color:var(--ink)">Noter le candidat</div>
      <button id="closeReview" class="w-8 h-8 rounded-lg grid place-items-center" style="color:var(--mu);background:none;border:none;cursor:pointer"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="text-center mb-4">
      <div class="text-sm mb-2" style="color:var(--mu)">Votre note</div>
      <div class="rate-input" id="rateInput">
        <i class="fa-solid fa-star" data-v="1"></i>
        <i class="fa-solid fa-star" data-v="2"></i>
        <i class="fa-solid fa-star" data-v="3"></i>
        <i class="fa-solid fa-star" data-v="4"></i>
        <i class="fa-solid fa-star" data-v="5"></i>
      </div>
    </div>
    <div class="mb-4">
      <label for="reviewComment" class="lbl">Commentaire (optionnel)</label>
      <textarea id="reviewComment" class="input" rows="3" placeholder="Décrivez votre expérience…" maxlength="500"></textarea>
    </div>
    <p id="reviewError" class="hidden text-xs mb-3" style="color:var(--er)"></p>
    <div class="flex gap-2">
      <button id="cancelReview" class="btn bo flex-1">Annuler</button>
      <button id="submitReview" class="btn bp flex-1">Publier</button>
    </div>
  </div>
</div>

<script src="assets/ui.js"></script>
<script src="assets/env.js"></script>
<script src="assets/db.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/app.js"></script>
<script src="assets/realtime.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=n=>(n||'?').split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase()||'?';
let all=[],tab='all',reviewTarget=null,selectedRating=0;

const fmtDate=iso=>{
  const d=new Date(iso),diff=(Date.now()-d)/1000;
  if(diff<60)return 'à l\'instant';
  if(diff<3600)return `il y a ${Math.floor(diff/60)} min`;
  if(diff<86400)return `il y a ${Math.floor(diff/3600)} h`;
  if(diff<604800)return `il y a ${Math.floor(diff/86400)} j`;
  return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});
};

const statusBadge=s=>{
  if(s==='acceptee')return '<span class="bdg o"><i class="fa-solid fa-check"></i>Acceptée</span>';
  if(s==='refusee')return '<span class="bdg k"><i class="fa-solid fa-xmark"></i>Refusée</span>';
  return '<span class="bdg w"><i class="fa-solid fa-clock"></i>En attente</span>';
};

function resetModal(){
  selectedRating=0;reviewTarget=null;
  $('reviewComment').value='';$('reviewError').classList.add('hidden');
  document.querySelectorAll('#rateInput i').forEach(i=>{i.classList.remove('active');i.style.color=''});
}
document.querySelectorAll('#rateInput i').forEach(star=>{
  star.addEventListener('click',()=>{
    selectedRating=parseInt(star.dataset.v);
    document.querySelectorAll('#rateInput i').forEach(s=>{
      s.classList.toggle('active',parseInt(s.dataset.v)<=selectedRating);
    });
  });
});
$('closeReview').onclick=()=>{$('reviewModal').classList.remove('on');resetModal()};
$('cancelReview').onclick=()=>{$('reviewModal').classList.remove('on');resetModal()};
$('reviewModal').addEventListener('click',e=>{if(e.target.id==='reviewModal'){$('reviewModal').classList.remove('on');resetModal()}});

$('submitReview').onclick=async()=>{
  const err=$('reviewError');err.classList.add('hidden');
  if(!selectedRating){err.textContent='Choisissez une note.';err.classList.remove('hidden');return}
  const btn=$('submitReview');btn.disabled=true;
  btn.innerHTML='<i class="fa-solid fa-circle-notch fa-spin text-xs"></i>Publication…';
  try{
    const p=Auth.getProfile(),u=Auth.getUser();
    await DB.saveReview({
      authorId:u.id,authorName:p?.full_name||u.email,authorRole:p?.role||'entreprise',
      targetId:reviewTarget.id,targetRole:'particulier',
      rating:selectedRating,comment:$('reviewComment').value.trim()||null,
      missionTitle:reviewTarget.mission||null
    });
    DB.createNotification({
      userId:reviewTarget.id,type:'review',
      title:'Vous avez reçu un avis',
      body:`Note : ${selectedRating}/5`,
      link:`profil-public.html?id=${u.id}`,
      icon:'fa-star'
    });
    $('reviewModal').classList.remove('on');resetModal();
    alert('Avis publié avec succès.');
    Page.load();
  }catch(e){
    err.textContent=e.message;err.classList.remove('hidden');
    btn.disabled=false;btn.textContent='Publier';
  }
};

async function openReview(target){
  const me=Auth.getUser();
  if(!me)return;
  if(me.id===target.id){alert('Vous ne pouvez pas vous noter vous-même.');return}
  const already=await DB.hasReviewed(me.id,target.id);
  if(already){alert('Vous avez déjà laissé un avis sur ce candidat.');return}
  reviewTarget=target;resetModal();
  $('reviewModal').classList.add('on');
}

const Page=(()=>{
  async function load(){
    try{ all=await DB.getBusinessApplications() }catch(e){ all=[] }
    render();
  }

  function render(){
    const list=$('list');
    const filtered=tab==='all'?all:all.filter(a=>a.status===tab);
    $('count').textContent=filtered.length;

    if(!filtered.length){
      list.innerHTML=`<div class="empty">
        <i class="fa-solid fa-inbox"></i>
        <div class="font-semibold mb-1" style="color:var(--ink)">Aucune candidature</div>
        <div class="text-xs mb-5">Publiez une mission pour commencer à recevoir des candidatures.</div>
        <a href="publier-mission.html" class="btn bp text-xs">Publier une mission</a>
      </div>`;
      return;
    }

    list.innerHTML=filtered.map(a=>`
      <article class="item-card">
        <div class="flex items-start gap-3 mb-3 flex-wrap">
          <div class="w-11 h-11 rounded-full grid place-items-center font-bold text-sm shrink-0" style="background:color-mix(in srgb,var(--ac) 15%,transparent);color:var(--ac);border:1px solid color-mix(in srgb,var(--ac) 25%,transparent)">${initials(a.userName)}</div>
          <div class="flex-1 min-w-0">
            <div class="flex items-start justify-between gap-2 flex-wrap">
              <div class="min-w-0">
                <div class="font-semibold text-sm" style="color:var(--ink)">${esc(a.userName)}</div>
                <div class="text-xs" style="color:var(--mu)">${esc(a.userEmail)}</div>
              </div>
              ${statusBadge(a.status)}
            </div>
          </div>
        </div>

        <div class="p-3 rounded-lg mb-3" style="background:var(--bg);border:1px solid var(--bd)">
          <div class="flex items-center gap-2 text-xs mb-1">
            <i class="fa-solid fa-briefcase" style="color:var(--ac)"></i>
            <span class="font-semibold" style="color:var(--ink)">${esc(a.title)}</span>
          </div>
          <div class="flex items-center gap-3 text-xs" style="color:var(--mu)">
            <span><i class="fa-solid fa-building mr-1"></i>${esc(a.company)}</span>
            ${a.budget?`<span><i class="fa-solid fa-coins mr-1"></i>${esc(a.budget)} FCFA</span>`:''}
          </div>
        </div>

        ${a.message?`<p class="text-xs mb-3 italic p-3 rounded-lg" style="color:var(--mu);background:color-mix(in srgb,var(--ac) 5%,transparent);border-left:3px solid var(--ac)">« ${esc(a.message)} »</p>`:''}

        <div class="flex items-center justify-between gap-2 flex-wrap pt-2" style="border-top:1px solid var(--bd)">
          <span class="text-[10px]" style="color:var(--mu)"><i class="fa-regular fa-clock mr-1"></i>${fmtDate(a.createdAt)}</span>
          <div class="flex gap-2 flex-wrap">
            <button class="act" data-view="${esc(a.userId)}"><i class="fa-solid fa-user"></i>Profil</button>
            <button class="act" data-msg="${esc(a.userId)}" data-msgname="${esc(a.userName)}"><i class="fa-solid fa-comment"></i>Message</button>
            ${a.status==='envoyee'?`
              <button class="act act-ok" data-accept="${esc(a.id)}" data-user="${esc(a.userId)}" data-email="${esc(a.userEmail)}" data-name="${esc(a.userName)}" data-title="${esc(a.title)}"><i class="fa-solid fa-check"></i>Accepter</button>
              <button class="act act-ko" data-refuse="${esc(a.id)}" data-user="${esc(a.userId)}" data-email="${esc(a.userEmail)}" data-name="${esc(a.userName)}" data-title="${esc(a.title)}"><i class="fa-solid fa-xmark"></i>Refuser</button>
            `:''}
            ${a.status==='acceptee'?`
              <button class="act act-gold" data-review="${esc(a.userId)}" data-reviewname="${esc(a.userName)}" data-mission="${esc(a.title)}"><i class="fa-solid fa-star"></i>Noter</button>
            `:''}
          </div>
        </div>
      </article>
    `).join('');

    list.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>location.href='profil-public.html?id='+encodeURIComponent(b.dataset.view)));
    list.querySelectorAll('[data-msg]').forEach(b=>b.addEventListener('click',()=>contactUser(b.dataset.msg,b.dataset.msgname)));
    list.querySelectorAll('[data-accept]').forEach(b=>b.addEventListener('click',()=>changeStatus(b.dataset.accept,'acceptee',b.dataset)));
    list.querySelectorAll('[data-refuse]').forEach(b=>b.addEventListener('click',()=>changeStatus(b.dataset.refuse,'refusee',b.dataset)));
    list.querySelectorAll('[data-review]').forEach(b=>b.addEventListener('click',()=>openReview({id:b.dataset.review,name:b.dataset.reviewname,mission:b.dataset.mission})));
  }

  async function changeStatus(id,status,data){
    if(status==='refusee' && !confirm('Refuser cette candidature ? Le candidat recevra un email.'))return;
    try{
      await DB.updateApplicationStatus(id,status);
      try{
        if(data.email){
          const tpl=status==='acceptee'
            ?DB.templateCandidatureAcceptee({candidat:data.name,mission:data.title,company:Auth.getProfile()?.company_name||'AfroPulse'})
            :DB.templateCandidatureRefusee({candidat:data.name,mission:data.title,company:Auth.getProfile()?.company_name||'AfroPulse'});
          DB.notify({recipientId:data.user,to:data.email,toName:data.name,subject:tpl.subject,htmlBody:tpl.html,type:status==='acceptee'?'candidature':'message'});
        }
        DB.createNotification({
          userId:data.user,
          type:'candidature',
          title:status==='acceptee'?`✅ Candidature acceptée — ${data.title}`:`Candidature refusée — ${data.title}`,
          body:status==='acceptee'?'Félicitations ! Consultez la messagerie.' : "Ne vous découragez pas, d'autres missions vous attendent.",
          link:status==='acceptee'?'messages.html':'particulier.html#missions',
          icon:status==='acceptee'?'fa-check-circle':'fa-times-circle'
        });
      }catch(e){}
      await load();
    }catch(e){alert('Erreur : '+e.message)}
  }

  async function contactUser(id,name){
    if(!Auth.requireLogin())return;
    const me=Auth.getUser();
    if(me.id===id){alert('Vous ne pouvez pas vous contacter vous-même.');return}
    const prefill=`Bonjour ${name.split(' ')[0]}, merci pour votre candidature. J'aimerais échanger avec vous.`;
    try{
      const p=Auth.getProfile();
      await DB.sendMessage({
        senderId:me.id,senderName:p?.full_name||me.email,
        recipientId:id,recipientName:name,
        conversationId:DB._convIdPublic(me.id,id),
        content:prefill
      });
      location.href=`messages.html?with=${encodeURIComponent(id)}&name=${encodeURIComponent(name)}`;
    }catch(e){alert('Erreur : '+e.message)}
  }

  return{load};
})();

$('tabsBar').addEventListener('click',e=>{
  const b=e.target.closest('button[data-tab]');if(!b)return;
  $('tabsBar').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  tab=b.dataset.tab;Page.load();
});

addEventListener('DOMContentLoaded',async()=>{
  await new Promise(r=>setTimeout(r,600));
  if(!Auth.requireLogin())return;
  Page.load();
});
</script>
</body>
</html>
