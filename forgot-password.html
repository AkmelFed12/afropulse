<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mot de passe oublié, AfroPulse</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
<script>document.documentElement.classList.toggle('dark',localStorage.getItem('ap-theme')==='dark'||(!localStorage.getItem('ap-theme')&&matchMedia('(prefers-color-scheme:dark)').matches));</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tailwind.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="font-sans">

<main class="relative">
<div class="absolute inset-0 grid-bg pointer-events-none"></div>
<div class="relative max-w-md mx-auto px-4 py-16">

  <div class="text-center mb-8">
    <div class="w-12 h-12 mx-auto rounded-xl grid place-items-center mb-4" style="background:color-mix(in srgb,var(--ac) 10%,transparent);border:1px solid color-mix(in srgb,var(--ac) 20%,transparent)">
      <i class="fa-solid fa-key" style="color:var(--ac)"></i>
    </div>
    <h1 class="text-2xl font-bold mb-2">Mot de passe oublié</h1>
    <p class="text-sm" style="color:var(--mu)">Entrez votre email, nous vous enverrons un lien pour le réinitialiser.</p>
  </div>

  <form id="forgotForm" class="card-static p-6">
    <div>
      <label for="email" class="lbl">Adresse email</label>
      <input id="email" class="input" type="email" placeholder="vous@exemple.com" autocomplete="email" required>
    </div>
    <p id="error" class="hidden text-xs mt-4" style="color:var(--er)"></p>
    <p id="success" class="hidden text-xs mt-4" style="color:var(--ok)"></p>
    <button type="submit" id="btn" class="btn bp w-full mt-6">Envoyer le lien</button>
    <p class="text-xs text-center mt-4" style="color:var(--mu)">
      <a href="login.html" class="font-semibold" style="color:var(--ac)">Retour à la connexion</a>
    </p>
  </form>

</div>
</main>

<script src="assets/env.js"></script>
<script src="assets/db.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/app.js"></script>
<script>
const $=id=>document.getElementById(id);

$('forgotForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=$('btn'),err=$('error'),succ=$('success');
  err.classList.add('hidden');succ.classList.add('hidden');

  const email=$('email').value.trim();
  if(!/^\S+@\S+\.\S+$/.test(email)){err.textContent='Adresse email invalide.';err.classList.remove('hidden');return}

  btn.disabled=true;
  btn.innerHTML='<i class="fa-solid fa-circle-notch fa-spin text-xs"></i>Envoi…';
  try{
    await Auth.sendResetEmail(email);
    $('forgotForm').reset();
    succ.innerHTML='<i class="fa-solid fa-circle-check mr-1"></i>Un email vous a été envoyé. Vérifiez aussi vos spams.';
    succ.classList.remove('hidden');
  }catch(ex){
    err.textContent=ex.message;
    err.classList.remove('hidden');
  }
  btn.disabled=false;
  btn.textContent='Envoyer le lien';
});
</script>
</body>
</html>
