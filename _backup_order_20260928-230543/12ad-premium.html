<style>
body{background:var(--bg);min-height:100vh}
.adm-header{background:var(--sf);border-bottom:1px solid var(--bd);padding:1rem 1.25rem;position:sticky;top:0;z-index:50}
.adm-header-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.adm-brand{display:flex;align-items:center;gap:.6rem;font-weight:800;color:var(--ink);font-size:1.05rem}
.adm-brand i{color:var(--gd)}
.adm-badge{font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:.25rem .6rem;border-radius:999px;background:var(--er);color:#fff}
.adm-wrap{max-width:1400px;margin:0 auto;padding:1.5rem 1.25rem 5rem}

.stats-grid{display:grid;gap:.85rem;grid-template-columns:repeat(2,1fr);margin-bottom:1.5rem}
@media(min-width:768px){.stats-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{background:var(--sf);border:1px solid var(--bd);border-radius:.9rem;padding:1.15rem}
.stat-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin-bottom:.35rem;display:flex;align-items:center;gap:.35rem}
.stat-value{font-size:1.65rem;font-weight:800;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat-value.warn{color:var(--gd)}
.stat-value.ok{color:var(--ok)}
.stat-value.er{color:var(--er)}

.filters{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem;background:var(--sf);border:1px solid var(--bd);border-radius:.85rem;padding:.45rem}
.filter-btn{padding:.55rem .95rem;border:none;background:none;border-radius:.55rem;cursor:pointer;font-family:inherit;font-size:.78rem;font-weight:700;color:var(--mu);transition:.15s;display:inline-flex;align-items:center;gap:.4rem}
.filter-btn:hover{color:var(--ink);background:color-mix(in srgb,var(--ac) 6%,transparent)}
.filter-btn.on{background:var(--ac);color:#fff}
.filter-btn .badge{font-size:.65rem;background:rgba(255,255,255,.25);padding:.1rem .4rem;border-radius:999px}
.filter-btn.on .badge{background:rgba(255,255,255,.3)}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;margin-bottom:1rem}
.search-input{flex:1;min-width:220px;padding:.65rem .9rem;border:1.5px solid var(--bd);border-radius:.6rem;background:var(--sf);color:var(--ink);font-family:inherit;font-size:.82rem;outline:none;transition:.15s}
.search-input:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 12%,transparent)}
.refresh-btn{padding:.65rem 1rem;border:1px solid var(--bd);background:var(--sf);border-radius:.6rem;cursor:pointer;font-family:inherit;font-size:.78rem;font-weight:700;color:var(--mu);display:inline-flex;align-items:center;gap:.4rem;transition:.15s;text-decoration:none}
.refresh-btn:hover{border-color:var(--ac);color:var(--ac)}
.refresh-btn.spinning i{animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.requests-list{display:flex;flex-direction:column;gap:.85rem}
.req-card{background:var(--sf);border:1px solid var(--bd);border-radius:.95rem;overflow:hidden;transition:.2s}
.req-card:hover{border-color:color-mix(in srgb,var(--ac) 40%,var(--bd))}
.req-card.status-pending{border-left:4px solid var(--gd)}
.req-card.status-approved{border-left:4px solid var(--ok)}
.req-card.status-rejected{border-left:4px solid var(--er)}
.req-head{padding:1.1rem 1.25rem;display:flex;align-items:flex-start;gap:1rem;flex-wrap:wrap}
.req-main{flex:1;min-width:220px}
.req-ref{font-family:ui-monospace,Menlo,Monaco,Consolas,monospace;font-size:.75rem;font-weight:800;color:var(--ac);margin-bottom:.35rem;display:flex;align-items:center;gap:.5rem}
.req-ref-copy{background:none;border:none;color:var(--mu);cursor:pointer;padding:.15rem;font-size:.7rem;transition:.15s}
.req-ref-copy:hover{color:var(--ac)}
.req-customer{font-size:.95rem;font-weight:800;color:var(--ink);margin:0 0 .2rem}
.req-email{font-size:.75rem;color:var(--mu);margin:0 0 .35rem}
.req-meta{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem}
.req-tag{display:inline-flex;align-items:center;gap:.3rem;font-size:.68rem;font-weight:700;padding:.25rem .55rem;border-radius:999px;background:var(--bg);color:var(--mu);border:1px solid var(--bd)}
.req-tag.plan{background:color-mix(in srgb,var(--ac) 10%,transparent);color:var(--ac);border-color:color-mix(in srgb,var(--ac) 25%,transparent)}
.req-tag.method{background:color-mix(in srgb,var(--gd) 10%,transparent);color:var(--gd);border-color:color-mix(in srgb,var(--gd) 25%,transparent)}
.req-amount{text-align:right;flex-shrink:0;min-width:110px}
.req-amount-value{font-size:1.35rem;font-weight:800;color:var(--ac);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.req-amount-label{font-size:.65rem;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin-top:.2rem;font-weight:700}
.req-status{display:inline-flex;align-items:center;gap:.35rem;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:.3rem .65rem;border-radius:999px}
.req-status.pending{background:color-mix(in srgb,var(--gd) 15%,transparent);color:var(--gd)}
.req-status.approved{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.req-status.rejected{background:color-mix(in srgb,var(--er) 15%,transparent);color:var(--er)}

.req-body{padding:0 1.25rem 1.25rem;border-top:1px solid var(--bd);display:none}
.req-card.open .req-body{display:block;animation:slideDown .25s ease-out}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.req-details{display:grid;gap:.85rem;grid-template-columns:1fr;padding-top:1rem}
@media(min-width:640px){.req-details{grid-template-columns:1fr 1fr}}
.detail-block{background:var(--bg);border:1px solid var(--bd);border-radius:.75rem;padding:1rem}
.detail-title{font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin:0 0 .65rem}
.detail-rows{display:flex;flex-direction:column;gap:.4rem}
.detail-row{display:flex;justify-content:space-between;gap:.75rem;font-size:.8rem}
.detail-row-label{color:var(--mu);flex-shrink:0}
.detail-row-value{color:var(--ink);font-weight:700;text-align:right;word-break:break-word}

.proof-block{margin-top:1rem;grid-column:1/-1}
.proof-image{width:100%;max-width:500px;border-radius:.75rem;border:1px solid var(--bd);display:block;margin:0 auto;cursor:pointer;transition:.2s}
.proof-image:hover{transform:scale(1.01);box-shadow:0 12px 30px -12px rgba(0,0,0,.3)}
.proof-pdf{display:flex;align-items:center;gap:.85rem;padding:1.25rem;background:var(--bg);border:1px solid var(--bd);border-radius:.75rem;text-decoration:none;color:inherit;transition:.15s}
.proof-pdf:hover{border-color:var(--ac)}
.proof-pdf i{font-size:2rem;color:var(--er)}
.proof-pdf-info{flex:1;min-width:0}
.proof-pdf-name{font-size:.85rem;font-weight:700;color:var(--ink);margin:0;word-break:break-all}
.proof-pdf-sub{font-size:.7rem;color:var(--mu);margin:.15rem 0 0}

.note-block{margin-top:1rem;padding:1rem;background:color-mix(in srgb,var(--gd) 6%,transparent);border:1px solid color-mix(in srgb,var(--gd) 20%,transparent);border-radius:.75rem;grid-column:1/-1}
.note-title{font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--gd);margin:0 0 .35rem;display:flex;align-items:center;gap:.35rem}
.note-text{font-size:.82rem;color:var(--ink);line-height:1.55;margin:0}

.req-actions{display:flex;gap:.5rem;flex-wrap:wrap;padding:1rem 1.25rem;background:color-mix(in srgb,var(--bg) 50%,transparent);border-top:1px solid var(--bd)}
.req-actions .btn{flex:1;min-width:130px;justify-content:center}
.btn-approve{background:var(--ok);color:#fff;border:none;padding:.75rem 1.1rem;border-radius:.65rem;font-family:inherit;font-size:.82rem;font-weight:800;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:.5rem}
.btn-approve:hover:not(:disabled){background:color-mix(in srgb,var(--ok) 85%,#000);transform:translateY(-1px)}
.btn-approve:disabled{opacity:.55;cursor:wait}
.btn-reject{background:var(--er);color:#fff;border:none;padding:.75rem 1.1rem;border-radius:.65rem;font-family:inherit;font-size:.82rem;font-weight:800;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:.5rem}
.btn-reject:hover:not(:disabled){background:color-mix(in srgb,var(--er) 85%,#000);transform:translateY(-1px)}
.btn-reject:disabled{opacity:.55;cursor:wait}
.btn-outline{background:var(--bg);border:1.5px solid var(--bd);color:var(--ink);padding:.75rem 1.1rem;border-radius:.65rem;font-family:inherit;font-size:.82rem;font-weight:700;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;text-decoration:none}
.btn-outline:hover{border-color:var(--ac);color:var(--ac)}

.empty-state{background:var(--sf);border:1px dashed var(--bd);border-radius:.95rem;padding:3rem 1.5rem;text-align:center}
.empty-icon{width:72px;height:72px;border-radius:50%;margin:0 auto 1rem;background:color-mix(in srgb,var(--ac) 10%,transparent);color:var(--ac);font-size:1.75rem;display:grid;place-items:center}
.empty-title{font-size:1.1rem;font-weight:800;color:var(--ink);margin:0 0 .4rem}
.empty-sub{font-size:.85rem;color:var(--mu);margin:0;line-height:1.5}

.skeleton{height:100px;border-radius:.95rem;background:linear-gradient(90deg,var(--sf) 0%,color-mix(in srgb,var(--ac) 4%,var(--sf)) 50%,var(--sf) 100%);background-size:200% 100%;animation:shimmer 1.5s ease-in-out infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

.img-modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.9);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:1.5rem;cursor:zoom-out}
.img-modal.on{display:flex}
.img-modal img{max-width:95vw;max-height:95vh;border-radius:.75rem;box-shadow:0 24px 60px -20px rgba(0,0,0,.6)}
.img-modal-close{position:absolute;top:1rem;right:1rem;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:1.25rem;cursor:pointer;display:grid;place-items:center;transition:.15s}
.img-modal-close:hover{background:rgba(255,255,255,.25)}

.confirm-modal{position:fixed;inset:0;z-index:1000;background:rgba(15,23,42,.7);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:1.5rem}
.confirm-modal.on{display:flex}
.confirm-box{background:var(--sf);border:1px solid var(--bd);border-radius:1.15rem;padding:1.75rem;max-width:440px;width:100%;animation:slideUp .25s ease-out}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.confirm-icon{width:60px;height:60px;border-radius:50%;margin:0 auto 1rem;display:grid;place-items:center;font-size:1.5rem}
.confirm-icon.warn{background:color-mix(in srgb,var(--gd) 15%,transparent);color:var(--gd)}
.confirm-icon.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.confirm-icon.er{background:color-mix(in srgb,var(--er) 15%,transparent);color:var(--er)}
.confirm-title{font-size:1.1rem;font-weight:800;color:var(--ink);text-align:center;margin:0 0 .5rem}
.confirm-sub{font-size:.85rem;color:var(--mu);text-align:center;line-height:1.55;margin:0 0 1.25rem}
.confirm-input{width:100%;padding:.75rem .9rem;border:1.5px solid var(--bd);border-radius:.65rem;background:var(--bg);color:var(--ink);font-family:inherit;font-size:.85rem;outline:none;transition:.15s;margin-bottom:1rem;resize:vertical;min-height:70px}
.confirm-input:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 12%,transparent)}
.confirm-actions{display:flex;gap:.5rem}
.confirm-actions .btn{flex:1;justify-content:center}

.toast-container{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:.5rem;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:.75rem 1.1rem;border-radius:.65rem;font-size:.82rem;font-weight:600;box-shadow:0 12px 30px -8px rgba(0,0,0,.4);animation:toastIn .3s ease-out;pointer-events:auto;display:flex;align-items:center;gap:.5rem;max-width:90vw}
@keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.toast.success{background:var(--ok);color:#fff}
.toast.error{background:var(--er);color:#fff}
.toast i{font-size:.9rem}
.hidden{display:none!important}
</style>

<script>
const $ = id => document.getElementById(id);

function toast(msg, type = 'info'){
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const icons = { success: 'fa-circle-check', error: 'fa-circle-xmark', info: 'fa-circle-info' };
  el.innerHTML = `<i class="fa-solid ${icons[type] || icons.info}"></i><span>${msg}</span>`;
  $('toastContainer').appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .3s, transform .3s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(20px)';
    setTimeout(() => el.remove(), 300);
  }, 3200);
}

let allRequests = [];
let currentFilter = 'all';
let confirmCallback = null;
let confirmRequireReason = false;

function fmt(n){ return Number(n || 0).toLocaleString('fr-FR') + ' FCFA'; }
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function esc(s){ return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function methodLabel(m){ return { wave:'Wave', orange:'Orange Money', card:'Carte bancaire', djamo:'Djamo' }[m] || m || '—'; }

async function loadRequests(){
  const btn = $('refreshBtn');
  btn.classList.add('spinning');

  try{
    if(!DB.isRemote()){
      toast('Base de données indisponible', 'error');
      renderEmpty('Base indisponible');
      return;
    }

    const { data, error } = await DB.client.from('premium_requests').select('*').order('created_at', { ascending: false }).limit(500);

    if(error){
      console.error('[admin] load error:', error);
      toast('Erreur : ' + error.message, 'error');
      renderEmpty('Erreur de chargement');
      return;
    }

    allRequests = data || [];
    updateStats();
    updateBadges();
    applyFilters();

  }catch(err){
    console.error('[admin] error:', err);
    toast('Erreur réseau', 'error');
    renderEmpty('Erreur réseau');
  }finally{
    setTimeout(() => btn.classList.remove('spinning'), 400);
  }
}

function updateStats(){
  const pending = allRequests.filter(r => r.status === 'pending').length;
  const approved = allRequests.filter(r => r.status === 'approved').length;
  const rejected = allRequests.filter(r => r.status === 'rejected').length;
  const revenue = allRequests.filter(r => r.status === 'approved').reduce((sum, r) => sum + Number(r.total || r.amount || 0), 0);

  $('statPending').textContent = pending;
  $('statApproved').textContent = approved;
  $('statRejected').textContent = rejected;
  $('statRevenue').textContent = fmt(revenue).replace(' FCFA', '');
}

function updateBadges(){
  $('badgeAll').textContent = allRequests.length;
  $('badgePending').textContent = allRequests.filter(r => r.status === 'pending').length;
  $('badgeApproved').textContent = allRequests.filter(r => r.status === 'approved').length;
  $('badgeRejected').textContent = allRequests.filter(r => r.status === 'rejected').length;
}

function setFilter(f){
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('on', b.dataset.filter === f));
  applyFilters();
}

function applyFilters(){
  const search = ($('searchInput').value || '').toLowerCase().trim();
  let list = allRequests.slice();

  if(currentFilter !== 'all'){
    list = list.filter(r => r.status === currentFilter);
  }

  if(search){
    list = list.filter(r => {
      const haystack = [r.ref, r.ticket, r.customer_email, r.customer_name, r.customer_phone, r.plan, r.payment_method, r.payment_method_label].filter(Boolean).join(' ').toLowerCase();
      return haystack.includes(search);
    });
  }

  renderList(list);
}

function renderList(list){
  const container = $('requestsList');
  if(!list.length){ renderEmpty('Aucune demande'); return; }
  container.innerHTML = list.map(r => renderCard(r)).join('');
}

function renderEmpty(msg = 'Aucune demande'){
  $('requestsList').innerHTML = `
    <div class="empty-state">
      <div class="empty-icon"><i class="fa-solid fa-inbox"></i></div>
      <h3 class="empty-title">${esc(msg)}</h3>
      <p class="empty-sub">Les nouvelles demandes apparaîtront ici automatiquement.</p>
    </div>`;
}

function renderCard(r){
  const status = r.status || 'pending';
  const statusLabels = { pending: 'En attente', approved: 'Approuvée', rejected: 'Rejetée' };
  const statusIcons = { pending: 'fa-clock', approved: 'fa-circle-check', rejected: 'fa-circle-xmark' };

  const amount = Number(r.total || r.amount || 0);
  const isPdf = (r.proof_url || '').toLowerCase().endsWith('.pdf') || (r.proof_filename || '').toLowerCase().endsWith('.pdf');

  const proofBlock = r.proof_url ? (
    isPdf ? `
      <div class="proof-block">
        <div class="detail-title">Preuve de paiement (PDF)</div>
        <a href="${esc(r.proof_url)}" target="_blank" rel="noopener" class="proof-pdf">
          <i class="fa-solid fa-file-pdf"></i>
          <div class="proof-pdf-info">
            <p class="proof-pdf-name">${esc(r.proof_filename || 'Document.pdf')}</p>
            <p class="proof-pdf-sub">Cliquez pour ouvrir dans un nouvel onglet</p>
          </div>
          <i class="fa-solid fa-arrow-up-right-from-square" style="color:var(--mu)"></i>
        </a>
      </div>` : `
      <div class="proof-block">
        <div class="detail-title">Preuve de paiement</div>
        <img src="${esc(r.proof_url)}" alt="Preuve" class="proof-image" onclick="openImageModal('${esc(r.proof_url)}')" onerror="this.outerHTML='<div style=&quot;padding:2rem;text-align:center;color:var(--er);background:var(--bg);border:1px dashed var(--er);border-radius:.75rem&quot;><i class=&quot;fa-solid fa-image-slash&quot; style=&quot;font-size:1.5rem;margin-bottom:.5rem;display:block&quot;></i>Image introuvable. Vérifiez que le bucket uploads est public.</div>'">
      </div>`
  ) : `<div class="proof-block"><div class="detail-title">Preuve de paiement</div><p style="color:var(--mu);font-size:.8rem;text-align:center;padding:1.5rem">Aucune preuve</p></div>`;

  const noteBlock = r.note ? `
    <div class="note-block">
      <div class="note-title"><i class="fa-solid fa-comment-dots"></i>Note du client</div>
      <p class="note-text">${esc(r.note)}</p>
    </div>` : '';

  const actionsBlock = status === 'pending' ? `
    <div class="req-actions">
      <button class="btn-approve" onclick="approveRequest('${r.id}')">
        <i class="fa-solid fa-circle-check"></i> Approuver et activer
      </button>
      <button class="btn-reject" onclick="rejectRequest('${r.id}')">
        <i class="fa-solid fa-circle-xmark"></i> Rejeter
      </button>
    </div>` : '';

  return `
    <div class="req-card status-${status}" id="card-${r.id}">
      <div class="req-head" onclick="toggleCard('${r.id}')" style="cursor:pointer">
        <div class="req-main">
          <div class="req-ref">
            <i class="fa-solid fa-hashtag"></i>
            ${esc(r.ref || 'Sans référence')}
            <button class="req-ref-copy" onclick="event.stopPropagation();copyText('${esc(r.ref)}')" title="Copier">
              <i class="fa-regular fa-copy"></i>
            </button>
          </div>
          <p class="req-customer">${esc(r.customer_name || 'Client')}</p>
          <p class="req-email">${esc(r.customer_email || '—')}${r.customer_phone ? ` · ${esc(r.customer_phone)}` : ''}</p>
          <div class="req-meta">
            <span class="req-tag plan"><i class="fa-solid fa-crown"></i>${esc((r.plan || 'pro').toUpperCase())} · ${esc(r.cycle === 'yearly' ? 'Annuel' : 'Mensuel')}</span>
            <span class="req-tag method"><i class="fa-solid fa-credit-card"></i>${esc(r.payment_method_label || methodLabel(r.payment_method))}</span>
            <span class="req-tag"><i class="fa-regular fa-clock"></i>${fmtDate(r.created_at)}</span>
          </div>
        </div>
        <div class="req-amount">
          <div class="req-amount-value">${fmt(amount).replace(' FCFA', '')}</div>
          <div class="req-amount-label">FCFA</div>
          <span class="req-status ${status}" style="margin-top:.4rem">
            <i class="fa-solid ${statusIcons[status]}"></i>${statusLabels[status] || status}
          </span>
        </div>
      </div>

      <div class="req-body">
        <div class="req-details">
          <div class="detail-block">
            <div class="detail-title">Détails de la commande</div>
            <div class="detail-rows">
              <div class="detail-row"><span class="detail-row-label">Référence</span><span class="detail-row-value">${esc(r.ref || '—')}</span></div>
              <div class="detail-row"><span class="detail-row-label">Ticket</span><span class="detail-row-value">${esc(r.ticket || '—')}</span></div>
              <div class="detail-row"><span class="detail-row-label">Formule</span><span class="detail-row-value">${esc(r.plan || '—')}</span></div>
              <div class="detail-row"><span class="detail-row-label">Cycle</span><span class="detail-row-value">${esc(r.cycle || '—')}</span></div>
              <div class="detail-row"><span class="detail-row-label">Montant</span><span class="detail-row-value">${fmt(r.amount || 0)}</span></div>
              <div class="detail-row"><span class="detail-row-label">Frais</span><span class="detail-row-value">${fmt(r.fee || 0)}</span></div>
              <div class="detail-row"><span class="detail-row-label">Total</span><span class="detail-row-value" style="color:var(--ac)">${fmt(r.total || 0)}</span></div>
            </div>
          </div>

          <div class="detail-block">
            <div class="detail-title">Client</div>
            <div class="detail-rows">
              <div class="detail-row"><span class="detail-row-label">Nom</span><span class="detail-row-value">${esc(r.customer_name || '—')}</span></div>
              <div class="detail-row"><span class="detail-row-label">Email</span><span class="detail-row-value">${esc(r.customer_email || '—')}</span></div>
              <div class="detail-row"><span class="detail-row-label">Téléphone</span><span class="detail-row-value">${esc(r.customer_phone || '—')}</span></div>
              <div class="detail-row"><span class="detail-row-label">Méthode</span><span class="detail-row-value">${esc(r.payment_method_label || methodLabel(r.payment_method))}</span></div>
              <div class="detail-row"><span class="detail-row-label">Date</span><span class="detail-row-value">${fmtDate(r.created_at)}</span></div>
              ${r.approved_at ? `<div class="detail-row"><span class="detail-row-label">Approuvée le</span><span class="detail-row-value">${fmtDate(r.approved_at)}</span></div>` : ''}
              ${r.rejected_at ? `<div class="detail-row"><span class="detail-row-label">Rejetée le</span><span class="detail-row-value">${fmtDate(r.rejected_at)}</span></div>` : ''}
            </div>
          </div>

          ${proofBlock}
          ${noteBlock}
          ${r.rejection_reason ? `
            <div class="note-block" style="background:color-mix(in srgb,var(--er) 6%,transparent);border-color:color-mix(in srgb,var(--er) 20%,transparent)">
              <div class="note-title" style="color:var(--er)"><i class="fa-solid fa-circle-exclamation"></i>Motif du rejet</div>
              <p class="note-text">${esc(r.rejection_reason)}</p>
            </div>` : ''}
        </div>
      </div>

      ${actionsBlock}
    </div>`;
}

function toggleCard(id){
  const card = $('card-' + id);
  if(card) card.classList.toggle('open');
}

function approveRequest(id){
  const r = allRequests.find(x => x.id === id);
  if(!r) return;
  openConfirm({
    icon: 'fa-circle-check',
    iconClass: 'ok',
    title: 'Approuver cette demande ?',
    sub: `Vous allez activer l'abonnement <strong>${esc((r.plan || 'pro').toUpperCase())}</strong> pour <strong>${esc(r.customer_name || 'ce client')}</strong>.<br>Le client sera notifié et son abonnement Premium sera actif immédiatement.`,
    okLabel: 'Approuver et activer',
    okClass: 'btn-approve',
    onOk: async () => { await doApprove(id); }
  });
}

async function doApprove(id){
  const r = allRequests.find(x => x.id === id);
  if(!r) return;

  try{
    const now = new Date();
    const expires = new Date(now);
    if(r.cycle === 'yearly') expires.setFullYear(expires.getFullYear() + 1);
    else expires.setMonth(expires.getMonth() + 1);

    const user = Auth?.getUser?.();
    const payload = { status: 'approved', approved_at: now.toISOString(), approved_by: user?.id || null };

    const { error: upErr } = await DB.client.from('premium_requests').update(payload).eq('id', id);
    if(upErr) throw upErr;

    if(r.user_id){
      // ✅ user_premium utilise user_id comme PK
      const { error: premErr } = await DB.client.from('user_premium').upsert({
        user_id: r.user_id,
        plan: r.plan || 'pro',
        cycle: r.cycle || 'monthly',
        status: 'active',
        activated_at: now.toISOString(),
        expires_at: expires.toISOString(),
        payment_method: 'direct',
        last_transaction_id: r.ref,
        updated_at: now.toISOString()
      }, { onConflict: 'user_id' });

      if(premErr) console.warn('[admin] user_premium upsert error:', premErr);

      try{
        await DB.client.from('notifications').insert({
          user_id: r.user_id,
          type: 'premium_activated',
          title: 'Abonnement activé 🎉',
          body: `Votre abonnement ${(r.plan || 'pro').toUpperCase()} est actif jusqu'au ${expires.toLocaleDateString('fr-FR')}.`,
          link: 'abonnement.html',
          icon: 'fa-crown'
        });
      }catch(e){ console.warn('[admin] notification error:', e); }
    }

    toast('Abonnement activé avec succès', 'success');
    await loadRequests();

  }catch(err){
    console.error('[admin] approve error:', err);
    toast('Erreur : ' + (err.message || "impossible d'approuver"), 'error');
  }
}

function rejectRequest(id){
  const r = allRequests.find(x => x.id === id);
  if(!r) return;
  openConfirm({
    icon: 'fa-circle-xmark',
    iconClass: 'er',
    title: 'Rejeter cette demande ?',
    sub: `Vous allez rejeter la demande de <strong>${esc(r.customer_name || 'ce client')}</strong>. Le motif sera visible par le client dans son espace.`,
    okLabel: 'Confirmer le rejet',
    okClass: 'btn-reject',
    requireReason: true,
    onOk: async (reason) => { await doReject(id, reason); }
  });
}

async function doReject(id, reason){
  try{
    const now = new Date().toISOString();
    const user = Auth?.getUser?.();

    const { error } = await DB.client.from('premium_requests').update({
      status: 'rejected',
      rejected_at: now,
      rejected_by: user?.id || null,
      rejection_reason: reason || 'Aucun motif fourni'
    }).eq('id', id);

    if(error) throw error;

    const r = allRequests.find(x => x.id === id);
    if(r?.user_id){
      try{
        await DB.client.from('notifications').insert({
          user_id: r.user_id,
          type: 'premium_rejected',
          title: 'Demande de paiement rejetée',
          body: reason || "Votre preuve de paiement n'a pas pu être validée. Contactez le support.",
          link: 'abonnement.html',
          icon: 'fa-circle-xmark'
        });
      }catch(e){}
    }

    toast('Demande rejetée', 'success');
    await loadRequests();

  }catch(err){
    console.error('[admin] reject error:', err);
    toast('Erreur : ' + (err.message || 'impossible de rejeter'), 'error');
  }
}

function openConfirm({ icon, iconClass, title, sub, okLabel, okClass, onOk, requireReason }){
  $('confirmIcon').className = 'confirm-icon ' + (iconClass || 'warn');
  $('confirmIcon').innerHTML = `<i class="fa-solid ${icon}"></i>`;
  $('confirmTitle').textContent = title;
  $('confirmSub').innerHTML = sub;

  const okBtn = $('confirmOkBtn');
  okBtn.className = okClass || 'btn-approve';
  okBtn.innerHTML = `<i class="fa-solid fa-check"></i> ${okLabel || 'Confirmer'}`;

  const reasonEl = $('confirmReason');
  if(requireReason){ reasonEl.classList.remove('hidden'); reasonEl.value = ''; confirmRequireReason = true; }
  else{ reasonEl.classList.add('hidden'); confirmRequireReason = false; }

  confirmCallback = onOk;
  $('confirmModal').classList.add('on');
}

function closeConfirm(){
  $('confirmModal').classList.remove('on');
  confirmCallback = null;
  confirmRequireReason = false;
}

async function confirmOk(){
  const reason = $('confirmReason').value.trim();
  if(confirmRequireReason && !reason){
    toast('Veuillez saisir un motif', 'error');
    $('confirmReason').focus();
    return;
  }

  const btn = $('confirmOkBtn');
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Traitement…';

  try{
    await confirmCallback(reason);
    closeConfirm();
  }catch(err){
    console.error('[confirm] error:', err);
  }finally{
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

function openImageModal(url){
  $('imgModalSrc').src = url;
  $('imgModal').classList.add('on');
}

function closeImageModal(){
  $('imgModal').classList.remove('on');
  $('imgModalSrc').src = '';
}

function copyText(text){
  navigator.clipboard.writeText(text || '').then(() => {
    toast('Copié : ' + text, 'success');
  }).catch(() => { toast('Impossible de copier', 'error'); });
}

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closeImageModal(); closeConfirm(); }
  if(e.key === 'r' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); loadRequests(); }
});

addEventListener('DOMContentLoaded', async () => {
  if(typeof Theme !== 'undefined') Theme.init();
  await new Promise(r => setTimeout(r, 400));

  if(!Auth?.isLogged?.()){
    toast('Connexion requise', 'error');
    setTimeout(() => location.href = 'login.html?next=12ad-premium.html', 800);
    return;
  }

  await loadRequests();

  setInterval(() => {
    if(!$('imgModal').classList.contains('on') && !$('confirmModal').classList.contains('on')){
      loadRequests();
    }
  }, 30000);
});
</script>
