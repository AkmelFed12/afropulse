<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
.dash-wrap{max-width:1200px;margin:0 auto;padding:1.5rem 1rem 5rem;position:relative}
.dash-hero{
  background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 8%,transparent),color-mix(in srgb,var(--gd) 6%,transparent));
  border:1px solid var(--bd);border-radius:1.25rem;padding:1.75rem;margin-bottom:1.5rem;
  display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;
}
.dash-avatar{
  width:80px;height:80px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--ac),var(--gd));
  color:#fff;font-weight:800;font-size:1.75rem;
  display:grid;place-items:center;overflow:hidden;
  border:3px solid var(--sf);box-shadow:0 12px 30px -10px rgba(0,0,0,.2);
}
.dash-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.dash-hero-info{flex:1;min-width:220px}
.dash-hero-name{font-size:1.4rem;font-weight:800;color:var(--ink);margin:0 0 .35rem;letter-spacing:-.02em}
.dash-hero-meta{font-size:.82rem;color:var(--mu);margin:0;display:flex;align-items:center;gap:.85rem;flex-wrap:wrap}
.dash-hero-meta i{color:var(--ac)}
.dash-hero-actions{display:flex;gap:.5rem;flex-wrap:wrap}
.dash-hero-actions .btn{white-space:nowrap}

.stats-grid{display:grid;gap:.85rem;grid-template-columns:repeat(2,1fr);margin-bottom:1.5rem}
@media(min-width:768px){.stats-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{background:var(--sf);border:1px solid var(--bd);border-radius:.9rem;padding:1.15rem;transition:.15s;text-decoration:none;color:inherit;display:block}
.stat-card:hover{border-color:var(--ac);transform:translateY(-2px)}
.stat-label{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin-bottom:.4rem;display:flex;align-items:center;gap:.4rem}
.stat-value{font-size:1.75rem;font-weight:800;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat-value.ac{color:var(--ac)}
.stat-value.ok{color:var(--ok)}
.stat-value.warn{color:var(--gd)}
.stat-sub{font-size:.72rem;color:var(--mu);margin-top:.35rem}

.panel{background:var(--sf);border:1px solid var(--bd);border-radius:1rem;padding:1.25rem;margin-bottom:1rem}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:1rem;flex-wrap:wrap}
.panel-title{font-size:.95rem;font-weight:800;color:var(--ink);margin:0;display:flex;align-items:center;gap:.55rem}
.panel-title i{color:var(--ac)}
.panel-link{font-size:.75rem;font-weight:700;color:var(--ac);text-decoration:none;display:inline-flex;align-items:center;gap:.3rem}
.panel-link:hover{text-decoration:underline}

.list-item{
  display:flex;align-items:center;gap:.85rem;padding:.75rem;
  border-radius:.65rem;transition:.15s;text-decoration:none;color:inherit;
}
.list-item:hover{background:color-mix(in srgb,var(--ac) 5%,transparent)}
.list-item-icon{
  width:40px;height:40px;border-radius:.6rem;flex-shrink:0;
  display:grid;place-items:center;font-size:.95rem;
  background:color-mix(in srgb,var(--ac) 12%,transparent);color:var(--ac);
}
.list-item-body{flex:1;min-width:0}
.list-item-title{font-size:.85rem;font-weight:700;color:var(--ink);margin:0 0 .15rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item-sub{font-size:.72rem;color:var(--mu);margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.quick-grid{display:grid;gap:.75rem;grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.quick-grid{grid-template-columns:repeat(4,1fr)}}
.quick-btn{
  display:flex;flex-direction:column;align-items:center;gap:.5rem;
  padding:1.25rem .85rem;background:var(--bg);border:1px solid var(--bd);
  border-radius:.85rem;text-decoration:none;color:inherit;transition:.15s;
  text-align:center;
}
.quick-btn:hover{border-color:var(--ac);transform:translateY(-2px);background:color-mix(in srgb,var(--ac) 4%,transparent)}
.quick-icon{
  width:44px;height:44px;border-radius:.7rem;
  display:grid;place-items:center;font-size:1.1rem;
  background:color-mix(in srgb,var(--ac) 12%,transparent);color:var(--ac);
}
.quick-btn span{font-size:.78rem;font-weight:700;color:var(--ink);line-height:1.3}

.empty-mini{text-align:center;padding:1.5rem 1rem;color:var(--mu);font-size:.82rem}
.empty-mini i{font-size:1.5rem;opacity:.4;display:block;margin-bottom:.5rem}

.skeleton{height:80px;border-radius:.85rem;background:linear-gradient(90deg,var(--sf) 0%,color-mix(in srgb,var(--ac) 4%,var(--sf)) 50%,var(--sf) 100%);background-size:200% 100%;animation:shimmer 1.5s ease-in-out infinite;margin-bottom:.5rem}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

.reliability-bar{
  width:100%;height:6px;border-radius:3px;background:var(--bg);
  overflow:hidden;margin-top:.5rem;
}
.reliability-fill{
  height:100%;border-radius:3px;transition:width .6s ease;
  background:linear-gradient(90deg,var(--ac),var(--ok));
}
.badge-premium{
  display:inline-flex;align-items:center;gap:.35rem;
  font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
  padding:.3rem .6rem;border-radius:999px;
  background:linear-gradient(135deg,var(--gd),var(--gd2));color:#fff;
}
.badge-free{
  display:inline-flex;align-items:center;gap:.35rem;
  font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
  padding:.3rem .6rem;border-radius:999px;
  background:var(--bg);border:1px solid var(--bd);color:var(--mu);
}
</style>

    <div class="dash-avatar" id="dashAvatar">—</div>
    <div class="dash-hero-info">

<script>
const $ = id => document.getElementById(id);
function T(key, fallback){
  if(typeof I18n !== 'undefined' && I18n.t){
    const v = I18n.t(key);
    if(v && v !== key) return v;
  }
  return fallback;
}
const esc = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = n => (n||'?').split(' ').map(p => p[0]).slice(0,2).join('').toUpperCase();
function fmtMoney(n){ return Number(n || 0).toLocaleString('fr-FR') + ' FCFA'; }
function fmtDate(iso){
  if(!iso) return '—';
  return new Date(iso).toLocaleDateString('fr-FR', { day:'2-digit', month:'short' });
}
function timeAgo(iso){
  if(!iso) return '';
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if(s < 60) return T('time.now', "à l'instant");
  if(s < 3600) return `${Math.floor(s/60)}min`;
  if(s < 86400) return `${Math.floor(s/3600)}h`;
  return `${Math.floor(s/86400)}j`;
}

/* Réactivité grid */
function adaptGrid(){
  const twoCols = document.getElementById('twoCols');
  if(twoCols){
    twoCols.style.gridTemplateColumns = window.innerWidth >= 900 ? '1fr 1fr' : '1fr';
  }
}
addEventListener('resize', adaptGrid);

/* ═══ HERO ═══ */
function renderHero(profile, user){
  const name = profile?.full_name || user?.email?.split('@')[0] || 'Utilisateur';
  const firstName = name.split(' ')[0];

  $('heroName').textContent = `${T('dash.hello', 'Bonjour')} ${firstName} 👋`;

  const av = $('dashAvatar');
  if(profile?.avatar_url){
    av.innerHTML = `<img src="${esc(profile.avatar_url)}" alt="">`;
  }else{
    av.textContent = initials(name);
  }

  const meta = [];
  if(profile?.job_title) meta.push(`<span><i class="fa-solid fa-briefcase"></i> ${esc(profile.job_title)}</span>`);
  if(profile?.city) meta.push(`<span><i class="fa-solid fa-location-dot"></i> ${esc(profile.city)}</span>`);
  const role = profile?.role === 'entreprise' ? T('dash.role.company', 'Entreprise') : T('dash.role.individual', 'Particulier');
  meta.push(`<span><i class="fa-solid fa-user"></i> ${role}</span>`);

  $('heroMeta').innerHTML = meta.join('');
  $('viewPublicBtn').href = `profil-public.html?id=${user.id}`;
}

/* ═══ STATS ═══ */
async function loadStats(profile){
  // Premium
  try{
    const p = await DB.getUserPremium?.(Auth.getUser().id);
    if(p?.status === 'active' && p.expires_at && new Date(p.expires_at) > new Date()){
      const daysLeft = Math.ceil((new Date(p.expires_at) - new Date()) / 86400000);
      $('statPremium').innerHTML = `<span class="badge-premium"><i class="fa-solid fa-crown"></i>${esc((p.plan || 'pro').toUpperCase())}</span>`;
      $('statPremiumSub').textContent = `${daysLeft} ${T('dash.daysLeft', 'jours restants')}`;
    }else{
      $('statPremium').innerHTML = `<span class="badge-free">${T('dash.free', 'Gratuit')}</span>`;
      $('statPremiumSub').textContent = T('dash.upgrade', 'Passer Premium →');
    }
  }catch(e){
    $('statPremium').textContent = '—';
  }

  // Fiabilité
  try{
    const { score, breakdown } = await DB.getReliabilityScore(Auth.getUser().id);
    const lvl = DB.getReliabilityLevel(score);
    $('statReliability').textContent = score;
    $('statReliability').style.color = lvl.color;
    $('reliabilityBar').style.width = score + '%';
  }catch(e){ $('statReliability').textContent = '—'; }

  // Wallet
  try{
    const bal = await DB.getWalletBalance();
    $('statWallet').textContent = fmtMoney(bal).replace(' FCFA', '');
  }catch(e){ $('statWallet').textContent = '0'; }

  // Messages non lus
  try{
    const convs = await DB.getConversations();
    const unread = convs.reduce((s, c) => s + (c.unread || 0), 0);
    $('statMessages').textContent = unread;
  }catch(e){ $('statMessages').textContent = '0'; }
}

/* ═══ MESSAGES RÉCENTS ═══ */
async function loadRecentMessages(){
  const box = $('recentMessages');
  try{
    const convs = await DB.getConversations();
    if(!convs.length){
      box.innerHTML = `<div class="empty-mini"><i class="fa-solid fa-comments"></i>${T('dash.empty.messages', 'Aucun message pour l\'instant')}</div>`;
      return;
    }

    box.innerHTML = convs.slice(0, 4).map(c => {
      const ini = initials(c.otherName);
      const av = c.avatarUrl
        ? `<img src="${esc(c.avatarUrl)}" style="width:100%;height:100%;object-fit:cover" alt="">`
        : ini;
      return `
        <a href="messages.html?c=${encodeURIComponent(c.conversationId)}" class="list-item">
          <div class="list-item-icon" style="background:color-mix(in srgb,var(--ac) 15%,transparent);color:var(--ac);overflow:hidden">${av}</div>
          <div class="list-item-body">
            <p class="list-item-title">${esc(c.otherName || 'Utilisateur')}</p>
            <p class="list-item-sub">${esc((c.lastMessage || '').slice(0, 60))}</p>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:.25rem;flex-shrink:0">
            <span style="font-size:.65rem;color:var(--mu)">${timeAgo(c.lastAt)}</span>
            ${c.unread > 0 ? `<span style="background:var(--er);color:#fff;font-size:.65rem;font-weight:800;padding:.1rem .45rem;border-radius:999px">${c.unread}</span>` : ''}
          </div>
        </a>`;
    }).join('');
  }catch(e){
    box.innerHTML = `<div class="empty-mini"><i class="fa-solid fa-comments"></i>${T('common.error', 'Erreur de chargement')}</div>`;
  }
}

/* ═══ CONTRATS ═══ */
async function loadRecentContracts(){
  const box = $('recentContracts');
  try{
    const contracts = await DB.getMyContracts();
    if(!contracts.length){
      box.innerHTML = `<div class="empty-mini"><i class="fa-solid fa-file-signature"></i>${T('dash.empty.contracts', 'Aucun contrat pour l\'instant')}</div>`;
      return;
    }

    box.innerHTML = contracts.slice(0, 4).map(c => {
      const statusMap = {
        pending: { label: T('dash.contract.pending', 'En attente'), cls: 'warn' },
        active: { label: T('dash.contract.active', 'En cours'), cls: 'ac' },
        completed: { label: T('dash.contract.done', 'Terminé'), cls: 'ok' },
        cancelled: { label: T('dash.contract.cancelled', 'Annulé'), cls: 'er' }
      };
      const st = statusMap[c.status] || { label: c.status, cls: '' };
      return `
        <a href="contrat-detail.html?id=${encodeURIComponent(c.id)}" class="list-item">
          <div class="list-item-icon"><i class="fa-solid fa-file-signature"></i></div>
          <div class="list-item-body">
            <p class="list-item-title">${esc(c.title || 'Contrat')}</p>
            <p class="list-item-sub">${fmtMoney(c.amount || 0)}</p>
          </div>
          <span class="chip-mini ${st.cls}" style="flex-shrink:0">${esc(st.label)}</span>
        </a>`;
    }).join('');
  }catch(e){
    box.innerHTML = `<div class="empty-mini"><i class="fa-solid fa-file-signature"></i>${T('common.error', 'Erreur')}</div>`;
  }
}

/* ═══ NOTIFICATIONS ═══ */
async function loadRecentNotifs(){
  const box = $('recentNotifs');
  try{
    const notifs = await DB.getNotifications(5);
    if(!notifs.length){
      box.innerHTML = `<div class="empty-mini"><i class="fa-regular fa-bell-slash"></i>${T('notif.empty', 'Aucune notification')}</div>`;
      return;
    }

    box.innerHTML = notifs.map(n => `
      <a href="${esc(n.link || '#')}" class="list-item">
        <div class="list-item-icon"><i class="fa-solid ${n.icon || 'fa-bell'}"></i></div>
        <div class="list-item-body">
          <p class="list-item-title">${esc(n.title || '')}</p>
          ${n.body ? `<p class="list-item-sub">${esc(n.body)}</p>` : ''}
        </div>
        <span style="font-size:.65rem;color:var(--mu);flex-shrink:0">${timeAgo(n.created_at)}</span>
      </a>`).join('');
  }catch(e){
    box.innerHTML = `<div class="empty-mini"><i class="fa-regular fa-bell-slash"></i>${T('common.error', 'Erreur')}</div>`;
  }
}

/* ═══ INIT ═══ */
function initReveal(){
  const els = document.querySelectorAll('.reveal');
  if(!els.length) return;
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
  els.forEach(el => io.observe(el));
}

async function init(){
  adaptGrid();
  initReveal();

  await new Promise(r => setTimeout(r, 400));

  if(!Auth?.isLogged?.()){
    location.href = 'login.html?next=dashboard.html';
    return;
  }

  const user = Auth.getUser();
  const profile = Auth.getProfile() || await DB.getProfileById(user.id);

  renderHero(profile, user);

  await Promise.all([
    loadStats(profile),
    loadRecentMessages(),
    loadRecentContracts(),
    loadRecentNotifs()
  ]);

  if(typeof I18n !== 'undefined' && I18n.onChange){
    I18n.onChange(() => {
      renderHero(profile, user);
      loadStats(profile);
    });
  }
}

addEventListener('DOMContentLoaded', init);
</script>
