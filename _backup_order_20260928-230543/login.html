  <div class="auth-card">
    <a href="index.html" class="auth-logo">
      <span class="site-brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="color:var(--ac)"><path d="M2 12h3l2-5 3 10 3-12 3 8 2-3h3"/></svg>
      </span>
      <span style="font-weight:800;color:var(--ink);font-size:1.1rem">Afro<span style="color:var(--ac)">Pulse</span></span>
    </a>

    <h1 class="auth-title" data-i18n="login.title">Content de vous revoir</h1>
    <p class="auth-sub" data-i18n="login.sub">Connectez-vous pour accéder à votre espace</p>

    <div id="verifyNotice" class="notice warn hidden">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <div style="flex:1">
        <div class="title" data-i18n="login.verify.title">Votre email n'est pas encore confirmé</div>
        <div class="sub" data-i18n="login.verify.sub">Vérifiez votre boîte de réception (et vos spams) puis cliquez sur le lien de confirmation.</div>
        <button id="resendBtn" type="button">
          <i class="fa-solid fa-paper-plane"></i>
          <span data-i18n="login.verify.resend">Renvoyer l'email de confirmation</span>
        </button>
      </div>
    </div>

    <form id="form" onsubmit="doLogin(event)">
      <div class="form-row">
        <label for="email" class="lbl" data-i18n="login.email">Adresse email</label>
        <input id="email" type="email" class="input" required autocomplete="email" placeholder="vous@exemple.com">
      </div>

      <div class="form-row">
        <label for="password" class="lbl" data-i18n="login.password">Mot de passe</label>
        <div class="pwd-wrap">
          <input id="password" type="password" class="input" required autocomplete="current-password" placeholder="••••••••" style="padding-right:2.75rem">
          <button type="button" class="pwd-toggle" onclick="togglePwd()" aria-label="Afficher">
            <i id="pwdIcon" class="fa-solid fa-eye text-xs"></i>
          </button>
        </div>
      </div>

      <div class="fgt">
        <a href="forgot-password.html" data-i18n="login.forgot">Mot de passe oublié ?</a>
      </div>

      <p id="error" class="hidden text-xs" style="color:var(--er);margin-bottom:.75rem"></p>

      <button type="submit" id="submitBtn" class="btn bp btn-block">
        <i class="fa-solid fa-right-to-bracket"></i><span data-i18n="login.submit">Se connecter</span>
      </button>
    </form>

    <div class="auth-footer">
      <span data-i18n="login.noAccount">Pas encore de compte ?</span>

<script>
const $ = id => document.getElementById(id);
let lastEmailForResend = '';

function togglePwd(){
  const i = $('password');
  const ic = $('pwdIcon');
  if(i.type === 'password'){ i.type = 'text'; ic.className = 'fa-solid fa-eye-slash text-xs'; }
  else { i.type = 'password'; ic.className = 'fa-solid fa-eye text-xs'; }
}

function getNextUrl(){
  const p = new URLSearchParams(location.search);
  const next = p.get('next');
  if(next && !next.includes('login.html')) return next;
  return 'dashboard.html';
}

async function doLogin(e){
  e.preventDefault();
  const btn = $('submitBtn');
  const err = $('error');
  const notice = $('verifyNotice');
  err.classList.add('hidden');
  notice.classList.add('hidden');

  const email = $('email').value.trim();
  const password = $('password').value;
  lastEmailForResend = email;

  btn.disabled = true;
  const original = btn.innerHTML;
  btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>…';

  try{
    await Auth.login({ email, password });
    UI.toast('OK', 'success');
    setTimeout(() => location.href = getNextUrl(), 500);
  }catch(ex){
    const code = ex.code || '';
    const msg = (ex.message || '').toLowerCase();

    if(code === 'EMAIL_NOT_CONFIRMED' || msg.includes('not confirmed') || msg.includes('confirm')){
      notice.classList.remove('hidden');
      err.textContent = I18n.t('login.verify.title');
      err.classList.remove('hidden');
      notice.scrollIntoView({ behavior:'smooth', block:'nearest' });
    }else{
      err.textContent = ex.message || 'Erreur';
      err.classList.remove('hidden');
    }
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

async function resendConfirm(){
  if(!lastEmailForResend){
    lastEmailForResend = $('email').value.trim();
  }
  if(!lastEmailForResend) return;

  const btn = $('resendBtn');
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i><span>…</span>';

  try{
    await Auth.resendConfirmation(lastEmailForResend);
    UI.toast(I18n.t('emailBanner.sent'), 'success');
    btn.innerHTML = '<i class="fa-solid fa-check"></i><span>OK</span>';
    setTimeout(() => {
      btn.disabled = false;
      btn.innerHTML = original;
    }, 4000);
  }catch(e){
    UI.toast(e.message || 'Erreur', 'error');
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

addEventListener('DOMContentLoaded', async () => {
  await new Promise(r => setTimeout(r, 400));

  if(typeof Auth !== 'undefined' && Auth.isLogged && Auth.isLogged()){
    location.href = getNextUrl();
    return;
  }

  const p = new URLSearchParams(location.search);
  if(p.get('confirmed') === '1'){
    UI.toast('OK', 'success');
  }

  $('resendBtn').addEventListener('click', resendConfirm);
});
</script>
