<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Talents, AfroPulse</title>
<meta name="description" content="Découvrez les talents africains du continent et de la diaspora : compétences, expériences et profils vérifiés.">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<script>document.documentElement.classList.toggle('dark',localStorage.getItem('ap-theme')==='dark'||(!localStorage.getItem('ap-theme')&&matchMedia('(prefers-color-scheme:dark)').matches));</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tailwind.css">
<link rel="stylesheet" href="assets/style.css">
<style>
/* ═══ SEARCHBAR ═══ */
.searchbar{
  background:var(--sf);
  border:1px solid var(--bd);
  border-radius:1.25rem;
  padding:1.25rem;
  display:grid;
  gap:.85rem;
  box-shadow:0 8px 28px -16px rgba(15,23,42,.12);
}
@media(min-width:768px){
  .searchbar{grid-template-columns:2fr 1fr 1fr auto;align-items:end;gap:1rem}
}
.searchbar .field{display:flex;flex-direction:column;gap:.35rem}
.searchbar .field label{
  font-size:.7rem;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.05em;
  color:var(--mu);
}
.filter-input{
  background:var(--bg);
  border:1px solid var(--bd);
  color:var(--ink);
  border-radius:.65rem;
  padding:.7rem .9rem;
  font-size:.85rem;
  width:100%;
  outline:none;
  font-family:inherit;
  transition:.15s;
}
.filter-input:focus{
  border-color:var(--ac);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 15%,transparent);
}

/* ═══ TALENT CARD ═══ */
.talent-card{
  background:var(--sf);
  border:1px solid var(--bd);
  border-radius:1.15rem;
  padding:1.35rem;
  transition:.25s cubic-bezier(.2,.8,.2,1);
  display:flex;
  flex-direction:column;
  position:relative;
}
.talent-card:hover{
  border-color:color-mix(in srgb,var(--ac) 40%,transparent);
  transform:translateY(-4px);
  box-shadow:0 16px 36px -18px rgba(15,23,42,.18);
}
.talent-avatar{
  width:56px;height:56px;
  border-radius:50%;
  display:grid;place-items:center;
  font-weight:800;
  font-size:1rem;
  flex-shrink:0;
  border:2px solid color-mix(in srgb,var(--ac) 25%,transparent);
  background:color-mix(in srgb,var(--ac) 15%,transparent);
  color:var(--ac);
  overflow:hidden;
}
.talent-avatar img{width:100%;height:100%;object-fit:cover}
.skill-tag{
  font-size:.68rem;
  font-weight:600;
  padding:.25rem .65rem;
  border-radius:999px;
  background:color-mix(in srgb,var(--ok) 12%,transparent);
  color:var(--ok);
  white-space:nowrap;
}
.talent-name{
  font-weight:800;
  font-size:.95rem;
  color:var(--ink);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  letter-spacing:-.01em;
}
.talent-job{
  font-size:.8rem;
  color:var(--ac);
  font-weight:600;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.talent-city{
  font-size:.72rem;
  color:var(--mu);
  display:flex;
  align-items:center;
  gap:.3rem;
  margin-top:.15rem;
}
.talent-bio{
  font-size:.8rem;
  line-height:1.55;
  color:var(--mu);
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  margin:.85rem 0 1rem;
  min-height:2.5em;
}
.talent-actions{
  display:flex;
  gap:.6rem;
  margin-top:auto;
  padding-top:1rem;
  border-top:1px solid var(--bd);
}

/* ═══ EMPTY STATE ═══ */
.empty-state{
  text-align:center;
  padding:4rem 1.5rem;
  grid-column:1 / -1;
}
.empty-icon{
  width:88px;height:88px;
  margin:0 auto 1.5rem;
  border-radius:1.75rem;
  display:grid;place-items:center;
  background:linear-gradient(135deg,
    color-mix(in srgb,var(--ac) 12%,transparent),
    color-mix(in srgb,var(--gd) 8%,transparent));
  border:1px solid color-mix(in srgb,var(--ac) 20%,transparent);
  position:relative;
}
.empty-icon::before{
  content:'';
  position:absolute;inset:-10px;
  border-radius:2rem;
  border:2px solid color-mix(in srgb,var(--ac) 25%,transparent);
  opacity:.5;
  animation:pulse 3s ease-out infinite;
}
@keyframes pulse{
  0%{transform:scale(.95);opacity:.5}
  100%{transform:scale(1.15);opacity:0}
}
.empty-icon i{
  font-size:2.25rem;
  background:linear-gradient(135deg,var(--ac),var(--gd));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.empty-title{
  font-size:1.35rem;
  font-weight:800;
  color:var(--ink);
  margin-bottom:.5rem;
  letter-spacing:-.02em;
}
.empty-desc{
  font-size:.9rem;
  color:var(--mu);
  max-width:440px;
  margin:0 auto 1.75rem;
  line-height:1.6;
}
.empty-actions{
  display:flex;
  gap:.75rem;
  justify-content:center;
  flex-wrap:wrap;
}

/* Suggestions dans l'état vide */
.empty-suggestions{
  margin-top:2rem;
  padding-top:2rem;
  border-top:1px solid var(--bd);
  max-width:600px;
  margin-left:auto;
  margin-right:auto;
}
.empty-suggestions-title{
  font-size:.72rem;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--mu);
  margin-bottom:1rem;
}
.suggestion-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:.6rem;
}
@media(min-width:520px){
  .suggestion-grid{grid-template-columns:repeat(4,1fr)}
}
.suggestion-chip{
  padding:.65rem .5rem;
  border-radius:.65rem;
  background:var(--bg);
  border:1px solid var(--bd);
  font-size:.75rem;
  font-weight:600;
  color:var(--ink);
  cursor:pointer;
  font-family:inherit;
  transition:.15s;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:.35rem;
  text-align:center;
}
.suggestion-chip:hover{
  border-color:var(--ac);
  color:var(--ac);
  transform:translateY(-2px);
}
.suggestion-chip i{
  font-size:.95rem;
  color:var(--ac);
}

/* ═══ COUNT BAR ═══ */
.results-count{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:.75rem;
  margin-bottom:1rem;
}
.results-count .label{
  font-size:.8rem;
  color:var(--mu);
}
.results-count .label strong{
  color:var(--ink);
  font-weight:800;
}
.reset-link{
  font-size:.78rem;
  font-weight:600;
  color:var(--ac);
  background:none;
  border:none;
  cursor:pointer;
  font-family:inherit;
  display:inline-flex;
  align-items:center;
  gap:.35rem;
  padding:.35rem .65rem;
  border-radius:.5rem;
  transition:.15s;
}
.reset-link:hover{
  background:color-mix(in srgb,var(--ac) 8%,transparent);
}
</style>
</head>
<body class="font-sans">

<main class="relative">
<div class="absolute inset-0 grid-bg pointer-events-none"></div>
<div class="relative max-w-6xl mx-auto px-4 py-10">

  <!-- ═══ HEADER ═══ -->
  <div class="mb-8">
    <span class="chip mb-4"><i class="fa-solid fa-magnifying-glass text-[10px]"></i>Annuaire</span>
    <h1 class="text-3xl sm:text-4xl font-bold mb-2" style="color:var(--ink)">
      Trouver un <span class="serif" style="color:var(--ac)">talent</span>
    </h1>
    <p class="text-sm max-w-2xl" style="color:var(--mu)">
      Filtrez par compétence, métier ou ville. Tous les profils sont des membres du réseau AfroPulse.
    </p>
  </div>

  <!-- ═══ SEARCHBAR ═══ -->
  <div class="searchbar mb-8">
    <div class="field">
      <label for="q">Recherche</label>
      <input id="q" class="filter-input" type="text" placeholder="Nom, métier, compétence…">
    </div>
    <div class="field">
      <label for="role">Type</label>
      <select id="role" class="filter-input">
        <option value="">Tous</option>
        <option value="particulier">Particulier</option>
        <option value="entreprise">Entreprise</option>
      </select>
    </div>
    <div class="field">
      <label for="country">Pays</label>
      <select id="country" class="filter-input"><option value="">Tous les pays</option></select>
    </div>
    <div>
      <button onclick="Talents.search()" class="btn bp" style="width:100%;white-space:nowrap">
        <i class="fa-solid fa-magnifying-glass text-xs"></i>Chercher
      </button>
    </div>
  </div>

  <!-- ═══ COMPTEUR + RESET ═══ -->
  <div class="results-count">
    <div class="label"><strong id="count">—</strong> talent(s) trouvé(s)</div>
    <button class="reset-link" onclick="Talents.reset()">
      <i class="fa-solid fa-rotate-left text-[10px]"></i>Réinitialiser les filtres
    </button>
  </div>

  <!-- ═══ RÉSULTATS ═══ -->
  <div id="results" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

</div>
</main>

<script src="assets/ui.js"></script>
<script src="assets/env.js"></script>
<script src="assets/db.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/locations.js"></script>
<script src="assets/app.js"></script>
<script src="assets/realtime.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initials=n=>(n||'?').split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase()||'?';

const Talents=(()=>{
  let all=[];
  let lastQuery={ q:'',role:'',country:'' };

  /* ═══ CHARGEMENT INITIAL ═══ */
  async function load(){
    const g=$('results');
    await UI.load({
      container:g,
      skeletonHtml:UI.skeleton.cards(6),
      loader:()=>UI.withTimeout(DB.searchTalents({limit:100}), 12000),
      onRender:(list)=>{
        all=list;
        render(list);
      }
    });
  }

  /* ═══ RECHERCHE AVEC FILTRES ═══ */
  async function search(){
    const g=$('results');
    lastQuery={
      q:$('q').value.trim(),
      role:$('role').value,
      country:$('country').value
    };
    await UI.load({
      container:g,
      skeletonHtml:UI.skeleton.cards(6),
      loader:()=>UI.withTimeout(DB.searchTalents(lastQuery), 12000),
      onRender:render
    });
  }

  /* ═══ RESET ═══ */
  function reset(){
    $('q').value='';
    $('role').value='';
    $('country').value='';
    lastQuery={q:'',role:'',country:''};
    render(all);
  }

  /* ═══ RENDU ═══ */
  function render(list){
    const g=$('results');
    $('count').textContent=list.length;

    if(!list.length){
      g.innerHTML=emptyStateHTML();
      bindEmptyStateActions();
      return;
    }

    g.innerHTML=list.map(p=>cardHTML(p)).join('');
  }

  /* ═══ CARTE TALENT ═══ */
  function cardHTML(p){
    const skills=(p.skills||'').split(',').map(s=>s.trim()).filter(Boolean).slice(0,3);
    const avatar=p.avatar_url
      ?`<div class="talent-avatar"><img src="${esc(p.avatar_url)}" alt="${esc(p.full_name)}"></div>`
      :`<div class="talent-avatar">${initials(p.full_name)}</div>`;

    const isEntreprise=p.role==='entreprise';
    const roleBadge=isEntreprise
      ?`<span class="text-[10px] font-bold px-1.5 py-0.5 rounded" style="background:color-mix(in srgb,var(--gd) 12%,transparent);color:var(--gd)">Entreprise</span>`
      :'';

    return `<article class="talent-card">
      <div class="flex items-start gap-3 mb-3">
        ${avatar}
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-1.5 flex-wrap mb-0.5">
            <div class="talent-name">${esc(p.full_name)}</div>
            ${roleBadge}
          </div>
          ${p.job_title?`<div class="talent-job">${esc(p.job_title)}</div>`:''}
          ${p.city?`<div class="talent-city"><i class="fa-solid fa-location-dot text-[10px]"></i>${esc(p.city)}</div>`:''}
        </div>
      </div>
      ${skills.length?`<div class="flex flex-wrap gap-1.5 mb-2">${skills.map(s=>`<span class="skill-tag">${esc(s)}</span>`).join('')}</div>`:''}
      <p class="talent-bio">${esc(p.bio||'Membre AfroPulse. Profil à découvrir.')}</p>
      <div class="talent-actions">
<a href="profil-public.html#id=${encodeURIComponent(p.id)}" class="btn bo flex-1 text-xs">          <i class="fa-solid fa-user text-[10px]"></i>Voir
        </a>
        <button onclick="contact('${esc(p.id)}','${esc(p.full_name)}')" class="btn bp text-xs" style="padding:.55rem .9rem">
          <i class="fa-solid fa-comment text-[10px]"></i>Contacter
        </button>
      </div>
    </article>`;
  }

  /* ═══ ÉTAT VIDE ENGAGEANT ═══ */
  function emptyStateHTML(){
    // Détermine si c'est à cause de filtres ou si vraiment la base est vide
    const hasFilters = lastQuery.q || lastQuery.role || lastQuery.country;
    const isFiltered = hasFilters && all.length > 0;

    if(isFiltered){
      // Cas : l'utilisateur a filtré mais aucun résultat
      return `<div class="empty-state">
        <div class="empty-icon">
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <h2 class="empty-title">Aucun résultat pour ces filtres</h2>
        <p class="empty-desc">
          Essayez d'élargir vos critères ou réinitialisez la recherche pour voir tous les talents du réseau.
        </p>
        <div class="empty-actions">
          <button onclick="Talents.reset()" class="btn bp">
            <i class="fa-solid fa-rotate-left text-xs"></i>Réinitialiser les filtres
          </button>
          <a href="particulier.html" class="btn bo">
            Explorer le réseau
          </a>
        </div>
      </div>`;
    }

    // Cas : la base est vide (nouveaux utilisateurs)
    return `<div class="empty-state">
      <div class="empty-icon">
        <i class="fa-solid fa-user-plus"></i>
      </div>
      <h2 class="empty-title">Soyez le premier talent du réseau</h2>
      <p class="empty-desc">
        Aucun profil n'est encore visible ici. Créez le vôtre en 3 minutes et rejoignez les premiers talents africains sur AfroPulse.
      </p>
      <div class="empty-actions">
        <a href="signup.html" class="btn bp">
          <i class="fa-solid fa-user-plus text-xs"></i>Créer mon profil
        </a>
        <a href="particulier.html" class="btn bo">
          Explorer les modules
        </a>
      </div>

      <div class="empty-suggestions">
        <div class="empty-suggestions-title">Explorer par catégorie</div>
        <div class="suggestion-grid">
          <button class="suggestion-chip" onclick="Talents.quickSearch('design')">
            <i class="fa-solid fa-palette"></i>
            <span>Design</span>
          </button>
          <button class="suggestion-chip" onclick="Talents.quickSearch('développement')">
            <i class="fa-solid fa-code"></i>
            <span>Développement</span>
          </button>
          <button class="suggestion-chip" onclick="Talents.quickSearch('marketing')">
            <i class="fa-solid fa-bullhorn"></i>
            <span>Marketing</span>
          </button>
          <button class="suggestion-chip" onclick="Talents.quickSearch('rédaction')">
            <i class="fa-solid fa-pen-fancy"></i>
            <span>Rédaction</span>
          </button>
        </div>
      </div>
    </div>`;
  }

  function bindEmptyStateActions(){
    // Rien de spécial : les onclick sont inline
  }

  /* ═══ RECHERCHE RAPIDE DEPUIS LES SUGGESTIONS ═══ */
  function quickSearch(term){
    $('q').value=term;
    search();
  }

  return{load,search,reset,quickSearch};
})();

/* ═══ CONTACTER UN TALENT ═══ */
async function contact(id,name){
  if(!Auth.requireLogin())return;
  const me=Auth.getUser();
  if(me.id===id){UI.toast('Vous ne pouvez pas vous contacter vous-même.','warn');return}
  const prefill=`Bonjour ${name.split(' ')[0]}, j'ai vu votre profil sur AfroPulse et j'aimerais échanger.`;
  try{
    await DB.sendMessage({
      senderId:me.id,
      senderName:Auth.getProfile()?.full_name||me.email,
      recipientId:id,
      recipientName:name,
      conversationId:DB._convIdPublic(me.id,id),
      content:prefill
    });
    location.href=`messages.html?with=${encodeURIComponent(id)}&name=${encodeURIComponent(name)}`;
  }catch(e){
    UI.toast('Erreur : '+e.message,'error');
  }
}

/* ═══ INIT ═══ */
addEventListener('DOMContentLoaded',async()=>{
  Locations.fillCountries($('country'));
  await new Promise(r=>setTimeout(r,600));
  await Talents.load();

  // Recherche en temps réel sur la touche Entrée
  $('q').addEventListener('keydown',e=>{if(e.key==='Enter')Talents.search()});
  $('role').addEventListener('change',()=>Talents.search());
  $('country').addEventListener('change',()=>Talents.search());
});
</script>
</body>
</html>
